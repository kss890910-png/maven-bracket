<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MaveN 2회 클럽 내전</title>
<meta property="og:title" content="MaveN 2회 클럽 내전">
<meta property="og:description" content="프리스타일 리부트 3대3 · 8팀 토너먼트 대진표">
<meta property="og:image" content="assets/logo.jpg">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: MaveN crest colors (black, brushed silver, gold). Key-art banner with the crest on top, round progress strip,
   then the bracket left → right. A checked winner lights a gold line from their slot into the next match. */
:root {
  --bg: #0a0a0b;
  --panel: #141416;
  --panel-2: #1c1c1f;
  --line: #2d2d32;
  --silver: #e3e4e8;
  --muted: #8e8f97;
  --gold: #e2b23f;
  --gold-hi: #f8db86;
  --ball: #f07a2a;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-num: "Oswald", "Arial Narrow", "IBM Plex Sans KR", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--silver); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gold-text {
  background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #a87a1e);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- hero ---------- */
.banner { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
.banner .art {
  position: absolute; inset: 0;
  background: url("assets/keyart.jpg") center 30% / cover no-repeat;
}
.banner .art::after {
  content: ""; position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(10,10,11,.96) 0%, rgba(10,10,11,.82) 38%, rgba(10,10,11,.15) 75%, rgba(10,10,11,.35) 100%),
    linear-gradient(180deg, transparent 55%, var(--bg) 100%);
}
.hero {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 28px;
  align-items: center;
  padding-block: 48px 64px;
  min-height: 380px;
}
.crest {
  width: clamp(150px, 18vw, 210px); aspect-ratio: 1; max-width: 100%;
  border-radius: 50%;
  object-fit: cover;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 60%, transparent), 0 0 60px -10px color-mix(in srgb, var(--gold) 55%, transparent);
}
.eyebrow {
  font-family: var(--f-num); letter-spacing: .3em; text-transform: uppercase;
  font-size: 13px; color: var(--gold);
  display: flex; align-items: center; gap: 10px;
}
.eyebrow i { width: 28px; height: 2px; background: var(--gold); display: inline-block; }
h1 { margin: 10px 0 0; font-weight: 400; line-height: 1; text-wrap: balance; }
h1 .club {
  display: block;
  font-family: var(--f-num); font-weight: 700; font-style: italic;
  font-size: clamp(56px, 9vw, 120px); letter-spacing: -.01em; line-height: .9;
  text-shadow: 0 8px 30px rgba(0,0,0,.6);
}
h1 .club .n { color: var(--silver); }
h1 .ev {
  display: block; margin-top: 12px;
  font-family: var(--f-display); font-size: clamp(28px, 3.6vw, 44px); color: var(--silver);
}
h1 .ev b { font-weight: 400; color: var(--gold); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.fact {
  border: 1px solid rgba(227,228,232,.18); border-radius: 999px; padding: 5px 13px;
  font-size: 13px; background: rgba(10,10,11,.6); backdrop-filter: blur(4px);
}
.fact b { font-family: var(--f-num); font-weight: 600; font-size: 15px; margin-right: 4px; color: var(--gold); }
.motto { margin-top: 14px; font-family: var(--f-num); letter-spacing: .25em; font-size: 12px; color: var(--muted); text-transform: uppercase; }

/* ---------- status + progress ---------- */
.status { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 22px 4px; }
.progress { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.step {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-radius: 10px;
  background: var(--panel); border: 1px solid var(--line);
}
.step .nm { font-family: var(--f-display); font-size: 16px; }
.step .ct { font-family: var(--f-num); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
.step .pips { display: flex; gap: 4px; }
.step .pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.step .pips i.on { background: var(--gold); }
.step.done { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.step.done .ct { color: var(--gold); }
.arrow { color: var(--line); font-family: var(--f-num); }
.mode {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; background: var(--panel);
  white-space: nowrap;
}
.mode .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.mode.admin { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); }
.mode.admin .dot, .mode.live .dot { background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.mode.warn .dot { background: var(--ball); }
.help { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.help b { color: var(--silver); font-weight: 600; }

/* ---------- bracket ---------- */
.scroller { overflow-x: auto; padding-block: 14px 36px; }
.bracket {
  position: relative; display: grid;
  grid-template-columns: repeat(3, 272px) 300px;
  column-gap: 64px; row-gap: 22px;
  min-width: calc(272px * 3 + 300px + 64px * 3);
}
.rnd-head {
  grid-row: 1; margin-bottom: -10px;
  font-family: var(--f-num); letter-spacing: .2em; font-size: 12px; color: var(--muted); text-transform: uppercase;
  display: flex; gap: 8px; align-items: baseline;
}
.rnd-head b { font-family: var(--f-display); font-weight: 400; letter-spacing: 0; font-size: 18px; color: var(--silver); }
svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.wires path { fill: none; stroke: var(--line); stroke-width: 2; }
svg.wires path.on { stroke: var(--gold); stroke-width: 3; filter: drop-shadow(0 0 4px color-mix(in srgb, var(--gold) 60%, transparent)); }
svg.wires path.fresh { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw .7s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

.match {
  position: relative; z-index: 1; align-self: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  box-shadow: 0 14px 30px -18px #000;
}
.match.done { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.m-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line);
  font-family: var(--f-num); font-size: 13px; letter-spacing: .08em;
}
.m-head .no { color: var(--ball); font-weight: 700; }
.m-head .st { color: var(--muted); font-family: var(--f-body); font-size: 12px; letter-spacing: 0; }
.match.done .m-head .st { color: var(--gold); }

.slot { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: stretch; min-height: 72px; }
.slot + .slot { border-top: 1px solid var(--line); }
.seed {
  display: grid; place-items: center;
  font-family: var(--f-num); font-weight: 700; font-size: 19px; color: var(--muted);
  border-right: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.who { padding: 8px 10px; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.who .tn { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.who .wait { color: var(--muted); font-size: 13px; font-style: normal; }
.badge {
  font-family: var(--f-num); font-size: 11px; letter-spacing: .1em; font-weight: 700;
  padding: 1px 6px; border-radius: 3px; background: var(--gold); color: #1a1405;
}
.mem { display: flex; flex-wrap: wrap; gap: 4px; }
.mem span {
  font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 4px;
  background: var(--panel-2); color: color-mix(in srgb, var(--silver) 85%, var(--muted)); white-space: nowrap;
}
.side { display: flex; align-items: stretch; border-left: 1px solid var(--line); }
.score {
  width: 44px; border: 0; background: transparent; color: var(--silver);
  font: 700 22px var(--f-num); text-align: center; font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.score::-webkit-outer-spin-button, .score::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.score::placeholder { color: var(--line); }
.score:read-only { cursor: default; }
.check {
  all: unset; box-sizing: border-box;
  width: 46px; display: grid; place-items: center; cursor: pointer;
  border-left: 1px solid var(--line);
  font: 700 12px var(--f-body); color: var(--muted);
}
.check .box {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line);
  display: grid; place-items: center; margin-bottom: 2px;
}
.check:hover .box { border-color: var(--gold); }
.check[aria-pressed="true"] { color: var(--gold); }
.check[aria-pressed="true"] .box { background: var(--gold); border-color: var(--gold); }
.check[aria-pressed="true"] .box::after { content: ""; width: 6px; height: 11px; border: solid #1a1405; border-width: 0 3px 3px 0; transform: translateY(-1px) rotate(45deg); }
.check:disabled { cursor: not-allowed; opacity: .35; }
.check:focus-visible, .score:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: -2px; }
.slot.win { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 18%, transparent), transparent 85%); }
.slot.win .seed, .slot.win .score { color: var(--gold); }
.slot.lose .who, .slot.lose .score, .slot.lose .seed { opacity: .38; }
.slot.lose .tn span:first-child { text-decoration: line-through; text-decoration-color: var(--muted); }
.slot.arrive { animation: arrive 1s ease-out; }
@keyframes arrive { 0% { background: color-mix(in srgb, var(--gold) 40%, transparent); } 100% { background: transparent; } }

.m1 { grid-column: 1; grid-row: 2; } .m2 { grid-column: 1; grid-row: 3; }
.m3 { grid-column: 1; grid-row: 4; } .m4 { grid-column: 1; grid-row: 5; }
.m5 { grid-column: 2; grid-row: 2 / 4; } .m6 { grid-column: 2; grid-row: 4 / 6; }
.m7 { grid-column: 3; grid-row: 2 / 6; }

/* ---------- champion ---------- */
.champ {
  grid-column: 4; grid-row: 2 / 6; align-self: center;
  position: relative; z-index: 1; text-align: center;
  padding: 24px 22px; border-radius: 16px;
  background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--gold) 24%, transparent), transparent 65%), var(--panel);
  border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line));
}
.champ img { width: 110px; height: 110px; border-radius: 50%; display: block; margin: 0 auto 8px; opacity: .55; filter: grayscale(.6); }
.champ.has img { opacity: 1; filter: none; box-shadow: 0 0 40px -6px color-mix(in srgb, var(--gold) 70%, transparent); }
.champ .lbl { font-family: var(--f-num); letter-spacing: .4em; font-size: 13px; color: var(--gold); }
.champ h2 { margin: 2px 0 14px; font-family: var(--f-num); font-style: italic; font-size: 44px; line-height: 1; }
.champ .team { font-family: var(--f-display); font-size: 30px; min-height: 40px; }
.champ .team.empty { font-family: var(--f-body); font-size: 15px; color: var(--muted); font-weight: 500; }
.champ .mem { justify-content: center; margin-top: 10px; }
.champ .mem span { font-size: 14px; padding: 6px 10px; background: color-mix(in srgb, var(--gold) 16%, var(--panel-2)); color: var(--silver); }
.champ.has { box-shadow: 0 0 0 1px var(--gold), 0 20px 60px -20px color-mix(in srgb, var(--gold) 60%, transparent); }
@media (prefers-reduced-motion: no-preference) {
  .champ.has img { animation: pop .7s ease-out; }
  @keyframes pop { 0% { transform: scale(.7) rotate(-10deg); } 70% { transform: scale(1.08); } 100% { transform: none; } }
}
@media (prefers-reduced-motion: reduce) {
  svg.wires path.fresh { animation: none; stroke-dashoffset: 0; }
  .slot.arrive { animation: none; }
}

/* ---------- roster ---------- */
.roster h3 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0 0 14px; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.tcard {
  display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 12px; align-items: center;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
}
.tcard .n { font-family: var(--f-num); font-style: italic; font-weight: 700; font-size: 30px; color: var(--silver); line-height: 1; font-variant-numeric: tabular-nums; }
.tcard.out { opacity: .45; }
.tcard.king { border-color: var(--gold); }
.tcard.king .n { color: var(--gold); }
.tcard .st { font-size: 12px; color: var(--muted); margin-top: 4px; }
.tcard .st.alive { color: var(--silver); }
.tcard.king .st { color: var(--gold); }

.admin-tools { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 18px; }
.btn {
  font: 600 13px var(--f-body); color: var(--silver);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--ball); }
.btn.armed { border-color: var(--ball); color: var(--ball); }

footer {
  margin-top: 36px; padding-block: 18px 32px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 12px;
  display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between;
}

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding-block: 28px 40px; gap: 18px; min-height: 0; }
  .crest { width: 120px; }
  .banner .art { background-position: 70% 20%; }
  .banner .art::after { background: linear-gradient(180deg, rgba(10,10,11,.55) 0%, rgba(10,10,11,.9) 55%, var(--bg) 100%); }
  .status { grid-template-columns: minmax(0, 1fr); }
  .bracket { grid-template-columns: repeat(3, 250px) 260px; column-gap: 44px; min-width: calc(250px * 3 + 260px + 44px * 3); }
}
.admin-tools { flex-wrap: wrap; }
.login { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.login input { font: 500 14px var(--f-body); color: var(--silver); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 150px; }
.login input:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 1px; }
.btn.ghost { background: transparent; color: var(--muted); }
body { margin: 0; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>

</head>

  <div class="art" role="img" aria-label="프리스타일 리부트 공식 키아트: 길거리 농구 캐릭터 네 명"></div>
  <div class="wrap">

const prevOn = new Set();
const prevTeam = {};

const bracket = document.getElementById("bracket");
const els = {};

function build() {
  for (const id of Object.keys(MATCHES)) {
    const card = document.createElement("article");
    card.className = "match m" + id;
    card.innerHTML =
      `<div class="m-head"><span class="no">${mno(id)}</span><span class="st"></span></div>` +
      [0, 1].map(s =>
        `<div class="slot" data-s="${s}">` +
          `<div class="seed">–</div><div class="who"></div>` +
          `<div class="side">` +
            `<input class="score" id="s${id}-${s}" type="number" inputmode="numeric" min="0" max="999" placeholder="–" aria-label="${mno(id)} ${s ? "아래" : "위"} 팀 점수">` +
            `<button class="check" type="button" aria-pressed="false" aria-label="${mno(id)} ${s ? "아래" : "위"} 팀 승리 체크"><span class="box"></span>승</button>` +
          `</div>` +
        `</div>`).join("");
    bracket.appendChild(card);
    els[id] = card;

    card.querySelectorAll(".check").forEach((btn, s) => btn.addEventListener("click", () => {
      const cur = results[id] || {};
      const before = winnerOf(+id);
      save(+id, { w: cur.w === s ? null : s, a: cur.a ?? null, b: cur.b ?? null });
      if (winnerOf(+id) !== before) clearDownstream(+id);
    }));
    card.querySelectorAll(".score").forEach((inp, s) => inp.addEventListener("change", () => {
      const cur = results[id] || {};
      const v = inp.value === "" ? null : Math.max(0, Math.floor(+inp.value));
      const next = { w: cur.w ?? null, a: cur.a ?? null, b: cur.b ?? null };
      next[s ? "b" : "a"] = v;
      save(+id, next);
    }));
  }
}

/* ---------- bracket logic ---------- */
function teamOf(side) { return typeof side === "number" ? side : winnerOf(+side.slice(1)); }
function sidesOf(id) { return MATCHES[id].sides.map(teamOf); }
function winnerSide(id) {
  const t = sidesOf(id);
  if (t[0] == null || t[1] == null) return null;
  const w = results[id]?.w;
  return w === 0 || w === 1 ? w : null;
}
function winnerOf(id) { const s = winnerSide(id); return s == null ? null : sidesOf(id)[s]; }
const memHTML = t => TEAMS[t].map(n => `<span>${n}</span>`).join("");

/* ---------- storage ---------- */
function enqueue(job) {
  queue = queue.then(job).catch(e => {
    if (e && e.code === "28P01") { logout(); setMode("warn", "PIN이 바뀌었거나 틀렸습니다. 다시 로그인해 주세요"); }
    else setMode("warn", "저장하지 못했습니다. 다시 체크해 주세요");
    load();
  });
}
async function rpc(fn, args) {
  const { error } = await sb.rpc(fn, args);
  if (error) throw error;
}
function save(id, body) {
  if (!isAdmin) return;
  const empty = body.w == null && body.a == null && body.b == null;
  if (empty) delete results[id]; else results[id] = { ...body, updated_at: new Date().toISOString() };
  render();
  enqueue(() => rpc("maven_set_result", { p_pin: pin, p_match: id, p_w: body.w, p_a: body.a, p_b: body.b }));
}
// A changed result invalidates every later match that team fed into.
function clearDownstream(id) {
  const ids = [];
  for (let n = NEXT[id]?.[0]; n; n = NEXT[n]?.[0]) if (results[n]) { ids.push(n); delete results[n]; }
  if (!ids.length) return;
  render();
  enqueue(() => rpc("maven_clear", { p_pin: pin, p_matches: ids }));
}
async function load() {
  const { data, error } = await sb.from("maven_bracket_results").select("match_id,w,a,b,updated_at");
  if (error) {
    setMode("warn", error.code === "42P01" || /does not exist|schema cache/.test(error.message || "")
      ? "결과 저장소가 아직 준비되지 않았습니다 (Supabase 설정 필요)"
      : "결과를 불러오지 못했습니다");
    return;
  }
  const next = {};
  data.forEach(r => { next[r.match_id] = r; });
  results = next;
  setMode(isAdmin ? "admin" : "live", isAdmin ? "관리자 · 결과 입력 가능" : "실시간 갱신 중");
  render();
  ready = true;
}
function setMode(kind, text) {
  document.getElementById("mode").className = "mode " + kind;
  document.getElementById("modeText").textContent = text;
}

/* ---------- admin ---------- */
const loginForm = document.getElementById("login");
const pinInput = document.getElementById("pin");
const openLogin = document.getElementById("openLogin");
const logoutBtn = document.getElementById("logout");
const resetBtn = document.getElementById("resetAll");

function applyAdmin() {
  openLogin.hidden = isAdmin;
  loginForm.hidden = true;
  logoutBtn.hidden = !isAdmin;
  resetBtn.hidden = !isAdmin;
  document.getElementById("help").innerHTML = isAdmin
    ? `<b>관리자 모드</b> · 이긴 팀의 <b>승</b> 칸을 체크하면 다음 경기로 올라갑니다. 다시 누르면 취소됩니다. 점수는 선택입니다.`
    : `경기 결과는 관리자가 체크합니다. 이긴 팀은 금색 선을 따라 다음 경기로 올라가고, 이 화면은 실시간으로 바뀝니다.`;
  setMode(isAdmin ? "admin" : "live", isAdmin ? "관리자 · 결과 입력 가능" : "실시간 갱신 중");
  render();
}
async function tryPin(p) {
  const { data, error } = await sb.rpc("maven_check_pin", { p_pin: p });
  return !error && data === true;
}
function logout() {
  isAdmin = false; pin = null;
  try { sessionStorage.removeItem(PIN_KEY); } catch (e) {}
  applyAdmin();
}
openLogin.addEventListener("click", () => { loginForm.hidden = false; openLogin.hidden = true; pinInput.focus(); });
loginForm.addEventListener("submit", async e => {
  e.preventDefault();
  const p = pinInput.value;
  if (!p || !sb) return;
  const msg = document.getElementById("loginMsg");
  msg.textContent = "확인 중…";
  if (await tryPin(p)) {
    pin = p; isAdmin = true; pinInput.value = ""; msg.textContent = "";
    try { sessionStorage.setItem(PIN_KEY, p); } catch (e) {}
    applyAdmin();
  } else {
    msg.textContent = "PIN이 맞지 않습니다";
  }
});
logoutBtn.addEventListener("click", logout);
resetBtn.addEventListener("click", () => {
  if (!resetBtn.classList.contains("armed")) {
    resetBtn.classList.add("armed"); resetBtn.textContent = "한 번 더 누르면 전체 삭제";
    setTimeout(() => { resetBtn.classList.remove("armed"); resetBtn.textContent = "전체 결과 초기화"; }, 4000);
    return;
  }
  resetBtn.classList.remove("armed"); resetBtn.textContent = "전체 결과 초기화";
  if (!isAdmin) return;
  results = {}; render();
  enqueue(() => rpc("maven_clear", { p_pin: pin, p_matches: [1, 2, 3, 4, 5, 6, 7] }));
});

/* ---------- render ---------- */
function render() {
  for (const [id, m] of Object.entries(MATCHES)) {
    const card = els[id];
    const t = sidesOf(id);
    const both = t[0] != null && t[1] != null;
    const ws = winnerSide(id);
    const r = results[id] || {};
    card.classList.toggle("done", ws != null);
    card.querySelector(".st").textContent =
      ws != null ? `TEAM ${pad(t[ws])} 진출 ▶` : both ? `${m.round} · 경기 전` : `${m.round} · 상대 기다리는 중`;

    card.querySelectorAll(".slot").forEach((slot, s) => {
      const team = t[s];
      const key = id + "-" + s;
      if (ready && team != null && prevTeam[key] !== team && typeof m.sides[s] === "string") {
        slot.classList.remove("arrive"); void slot.offsetWidth; slot.classList.add("arrive");
      }
      prevTeam[key] = team;
      slot.querySelector(".seed").textContent = team != null ? pad(team) : "–";
      slot.querySelector(".who").innerHTML = team != null
        ? `<div class="tn"><span>TEAM ${pad(team)}</span>${ws === s ? `<span class="badge">WIN</span>` : ""}</div><div class="mem">${memHTML(team)}</div>`
        : `<em class="wait">${mno(String(m.sides[s]).slice(1))} 승자가 올라옵니다</em>`;
      const inp = slot.querySelector(".score");
      const v = s ? r.b : r.a;
      inp.readOnly = !isAdmin || !both;
      inp.tabIndex = isAdmin ? 0 : -1;
      if (document.activeElement !== inp) inp.value = v == null ? "" : v;
      inp.hidden = !isAdmin && v == null;
      const chk = slot.querySelector(".check");
      chk.hidden = !isAdmin;
      chk.disabled = !both;
      chk.setAttribute("aria-pressed", String(ws === s));
      slot.classList.toggle("win", ws === s);
      slot.classList.toggle("lose", ws != null && ws !== s);
    });
  }

  const champ = winnerOf(7);
  document.getElementById("champ").classList.toggle("has", champ != null);
  const ct = document.getElementById("champTeam");
  ct.classList.toggle("empty", champ == null);
  ct.textContent = champ != null ? `TEAM ${pad(champ)}` : "결승 #07 승자";
  document.getElementById("champMem").innerHTML = champ != null ? memHTML(champ) : "";

  progress();
  roster();
  wires();
  const times = Object.values(results).map(r => r.updated_at).filter(Boolean).sort();
  document.getElementById("updated").textContent = times.length
    ? "마지막 기록 " + new Date(times[times.length - 1]).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : "";
}

function progress() {
  document.getElementById("progress").innerHTML = ROUNDS.map(([nm, ids], i) => {
    const done = ids.filter(id => winnerSide(id) != null).length;
    const pips = ids.map(id => `<i class="${winnerSide(id) != null ? "on" : ""}"></i>`).join("");
    return (i ? `<span class="arrow">▶</span>` : "") +
      `<div class="step ${done === ids.length ? "done" : ""}"><span class="nm">${nm}</span><span class="pips">${pips}</span><span class="ct">${done}/${ids.length}</span></div>`;
  }).join("");
}

function roster() {
  const lost = {}, reached = {};
  for (const id of Object.keys(MATCHES)) {
    const t = sidesOf(id), ws = winnerSide(id);
    t.forEach(x => { if (x != null) reached[x] = MATCHES[id].round; });
    if (ws != null) lost[t[1 - ws]] = MATCHES[id].round;
  }
  const champ = winnerOf(7);
  document.getElementById("teams").innerHTML = TEAMS.map((_, i) => {
    const cls = i === champ ? "king" : lost[i] ? "out" : "";
    const st = i === champ ? "우승" : lost[i] ? `${lost[i]} 탈락` : `${reached[i]} 진출`;
    return `<div class="tcard ${cls}"><div class="n">${pad(i)}</div><div><div class="mem">${memHTML(i)}</div><div class="st ${cls ? "" : "alive"}">${st}</div></div></div>`;
  }).join("");
}

function wires() {
  const svg = document.getElementById("wires");
  const base = bracket.getBoundingClientRect();
  const box = el => { const r = el.getBoundingClientRect(); return { l: r.left - base.left, r: r.right - base.left, cy: r.top - base.top + r.height / 2 }; };
  const out = [];
  const draw = (key, a, b, on) => {
    const mx = (a.r + b.l) / 2;
    const fresh = on && ready && !prevOn.has(key);
    if (on) prevOn.add(key); else prevOn.delete(key);
    out.push(`<path class="${on ? "on" : ""} ${fresh ? "fresh" : ""}" d="M${a.r} ${a.cy}H${mx}V${b.cy}H${b.l}"/>`);
  };
  for (const [from, [to, slot]] of Object.entries(NEXT)) {
    const ws = winnerSide(+from);
    const a = box(ws == null ? els[from] : els[from].querySelectorAll(".slot")[ws]); a.r = box(els[from]).r;
    draw(from, a, box(els[to].querySelectorAll(".slot")[slot]), ws != null);
  }
  const ws7 = winnerSide(7);
  const a7 = box(ws7 == null ? els[7] : els[7].querySelectorAll(".slot")[ws7]); a7.r = box(els[7]).r;
  draw("7", a7, box(document.getElementById("champ")), ws7 != null);
  svg.innerHTML = out.join("");
}

/* ---------- boot ---------- */
async function boot() {
  build();
  render();
  if (!window.supabase) { setMode("warn", "결과 서버에 연결하지 못했습니다"); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
  let saved = null;
  try { saved = sessionStorage.getItem(PIN_KEY); } catch (e) {}
  if (saved && await tryPin(saved)) { pin = saved; isAdmin = true; }
  applyAdmin();
  await load();
  sb.channel("maven-bracket")
    .on("postgres_changes", { event: "*", schema: "public", table: "maven_bracket_results" }, () => { if (!isAdmin) load(); })
    .subscribe();
  // Safety net if realtime is blocked on someone's network.
  setInterval(() => { if (!isAdmin && document.visibilityState === "visible") load(); }, 20000);
}

boot();
window.addEventListener("resize", wires);
document.fonts && document.fonts.ready.then(wires);
</script>
